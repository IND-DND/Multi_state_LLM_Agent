[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-sql-analytics"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4", "sqlglot>=26,<30", "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2,<3", "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "plotly>=6,<7", "pandas>=2.2,<3", "msal>=1.31,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["sql_analytics*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a bootstrapped PostgreSQL database"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
