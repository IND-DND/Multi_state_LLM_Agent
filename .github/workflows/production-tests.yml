name: Production analytics checks
on:
  push:
    paths: ['production/**', '.github/workflows/production-tests.yml']
  pull_request:
    paths: ['production/**', '.github/workflows/production-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: ci-disposable-postgres-password
          POSTGRES_DB: analytics
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d analytics"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENVIRONMENT: test
      AUTH_MODE: demo
      MODEL_PROVIDER: demo
      DEMO_JWT_SECRET: ci-only-disposable-signing-secret-never-production
      QUERY_DB_PASSWORD: ci-only-query-password-12345678
      CONTROL_DB_PASSWORD: ci-only-control-password-12345678
      CHECKPOINT_DB_PASSWORD: ci-only-checkpoint-password-12345678
      MIGRATION_DSN: postgresql://postgres:ci-disposable-postgres-password@localhost:5432/analytics
      QUERY_DSN: postgresql://analytics_gateway:ci-only-query-password-12345678@localhost:5432/analytics
      CONTROL_DSN: postgresql://analytics_control:ci-only-control-password-12345678@localhost:5432/analytics
      CHECKPOINT_DSN: postgresql://analytics_checkpoint:ci-only-checkpoint-password-12345678@localhost:5432/analytics
      RUN_DATABASE_TESTS: '1'
      REQUESTS_PER_MINUTE: '500'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python scripts/bootstrap.py --demo
      - run: python -m ruff check sql_analytics scripts ui tests
      - run: python -m pytest -q
      - run: touch .env && docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-disposable-postgres-password
      - run: docker build -t secure-sql-analytics:ci .
